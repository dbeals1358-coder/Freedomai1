name: Validate released MobileI2V ONNX models
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download published model assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p models
          gh release download mobilei2v-models-v1 --repo "${{ github.repository }}" --dir models --pattern '*.onnx' --pattern '*.json'
          ls -lh models
      - name: Install graph validation dependencies
        run: python -m pip install 'onnx==1.17.0' 'onnxruntime==1.20.1'
      - name: Validate graphs, signatures and hashes
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,onnx
          root=pathlib.Path('models')
          names=('vae_encoder.onnx','qwen2_encoder.onnx','mobilei2v_unet.onnx','turbo_vaed.onnx')
          report={}
          for name in names:
              p=root/name
              if not p.exists() or p.stat().st_size<1024: raise RuntimeError(f'Missing/truncated: {name}')
              print('Checking',name,flush=True)
              onnx.checker.check_model(str(p))
              model=onnx.load(str(p),load_external_data=False)
              inputs=[{'name':x.name,'type':str(x.type)} for x in model.graph.input]
              outputs=[{'name':x.name,'type':str(x.type)} for x in model.graph.output]
              if not inputs or not outputs: raise RuntimeError(f'No inputs/outputs: {name}')
              sha=hashlib.file_digest(p.open('rb'),'sha256').hexdigest()
              report[name]={'bytes':p.stat().st_size,'sha256':sha,'inputs':inputs,'outputs':outputs}
              del model
          (root/'github_validation.json').write_text(json.dumps(report,indent=2))
          print('Graph checks passed. This does NOT establish Android runtime compatibility or working video inference.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MobileI2V-validation-results
          path: models/github_validation.json
          if-no-files-found: warn
