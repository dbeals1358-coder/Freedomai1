name: Convert MobileI2V Models to ONNX

on:
  workflow_dispatch:
    inputs:
      optimize:
        description: "Also attempt ORT optimization (more time and disk)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  convert-models:
    name: Download, convert, and validate ONNX models
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_HOME: ${{ runner.temp }}/huggingface
      PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Boobs repository
        uses: actions/checkout@v4
      - name: Check available memory and storage
        run: |
          free -h
          df -h
          echo "Large model export may exceed standard hosted-runner RAM or disk."
      - name: Checkout MobileI2V conversion scripts
        uses: actions/checkout@v4
        with:
          repository: himadriHK/MobileI2VConsole
          path: mobilei2v-converter
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mobilei2v-converter/scripts/convert/requirements.txt
      - name: Install conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r mobilei2v-converter/scripts/convert/requirements.txt
          python -m pip install onnx onnxruntime
      - name: Download and convert all four components
        working-directory: mobilei2v-converter/scripts/convert
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/converted-models"
          if [ "${{ inputs.optimize }}" = "true" ]; then
            python convert_all.py --output "$GITHUB_WORKSPACE/converted-models" --optimize
          else
            python convert_all.py --output "$GITHUB_WORKSPACE/converted-models"
          fi
      - name: Verify exported ONNX graphs
        run: |
          python - <<'PY'
          import json, pathlib, hashlib
          import onnx
          import onnxruntime as ort
          root = pathlib.Path("converted-models")
          names = ["vae_encoder.onnx", "qwen2_encoder.onnx", "mobilei2v_unet.onnx", "turbo_vaed.onnx"]
          report = {}
          for name in names:
              path = root / name
              if not path.is_file() or path.stat().st_size < 1024:
                  raise RuntimeError(f"Missing or truncated ONNX model: {path}")
              onnx.checker.check_model(str(path))
              session = ort.InferenceSession(str(path), providers=["CPUExecutionProvider"])
              inputs = [i.name for i in session.get_inputs()]
              outputs = [o.name for o in session.get_outputs()]
              if not inputs or not outputs:
                  raise RuntimeError(f"Invalid ONNX inputs/outputs: {name}")
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024*1024), b""):
                      digest.update(chunk)
              report[name] = {"bytes": path.stat().st_size, "sha256": digest.hexdigest(), "inputs": inputs, "outputs": outputs}
              del session
          (root / "validation_report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Upload converted model package
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2V-ONNX-Models
          path: converted-models/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
