name: Titties V1.69 - Android APK Build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/unboundaistudio/StudioScreens.kt'
      - 'app/src/main/java/com/unboundaistudio/MainActivity.kt'
      - 'app/src/main/java/com/unboundaistudio/ObjectTransfer.kt'
      - 'app/src/main/java/com/unboundaistudio/HybridEngineSelector.kt'
      - 'app/src/test/java/com/unboundaistudio/HybridEngineSelectorTest.kt'
      - 'app/src/main/java/com/unboundaistudio/NightmareCatalog.kt'
      - 'app/src/test/java/com/unboundaistudio/NightmareCatalogTest.kt'
      - 'app/src/main/java/com/unboundaistudio/FictionalAdultPrompt.kt'
      - 'app/src/test/java/com/unboundaistudio/FictionalAdultPromptTest.kt'
      - 'app/src/main/java/com/unboundaistudio/AssistantScreen.kt'
      - 'app/src/main/java/com/unboundaistudio/AssistantCommandRouter.kt'
      - 'app/src/test/java/com/unboundaistudio/AssistantCommandRouterTest.kt'
      - 'app/src/main/java/com/unboundaistudio/VideoFrameContinuity.kt'
      - 'app/src/main/java/com/unboundaistudio/VideoMotionPrompt.kt'
      - 'app/src/test/java/com/unboundaistudio/VideoMotionPromptTest.kt'
      - 'app/src/main/java/com/unboundaistudio/NightmareEditGeometry.kt'
      - 'app/src/test/java/com/unboundaistudio/NightmareEditGeometryTest.kt'
      - 'app/src/main/java/com/unboundaistudio/EditRequestRouting.kt'
      - 'app/src/test/java/com/unboundaistudio/EditRequestRoutingTest.kt'
      - 'app/src/main/java/com/unboundaistudio/NightmareVideoQualityGate.kt'
      - 'app/src/test/java/com/unboundaistudio/VideoFrameContinuityTest.kt'
      - 'app/src/main/java/com/unboundaistudio/AutomaticClothingEdit.kt'
      - 'app/src/test/java/com/unboundaistudio/AutomaticClothingEditTest.kt'
      - 'app/src/main/java/com/unboundaistudio/NightmareEditModelPicker.kt'
      - 'app/src/test/java/com/unboundaistudio/NightmareEditModelPickerTest.kt'
      - 'app/src/main/java/com/unboundaistudio/NightmareVideoClient.kt'
      - 'app/src/main/java/com/unboundaistudio/HorizontalStripeRepair.kt'
      - 'app/src/main/java/com/unboundaistudio/AiSuperResolution.kt'
      - 'app/src/main/java/com/unboundaistudio/FaceDetailEnhancement.kt'
      - 'app/src/main/java/com/unboundaistudio/CartoonImagePrompt.kt'
      - 'app/src/main/java/com/unboundaistudio/CartoonDialogue.kt'
      - 'app/src/main/java/com/unboundaistudio/CartoonLetteringOverlay.kt'
      - 'app/src/test/java/com/unboundaistudio/CartoonDialogueTest.kt'
      - 'app/src/test/java/com/unboundaistudio/CartoonImagePromptTest.kt'
      - 'app/src/test/java/com/unboundaistudio/FaceDetailEnhancementTest.kt'
      - 'app/src/test/java/com/unboundaistudio/HorizontalStripeRepairTest.kt'
      - 'app/build.gradle.kts'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/java/com/unboundaistudio/NightmareClient.kt'
      - 'app/src/main/java/com/unboundaistudio/NightmareImageFlowPlanner.kt'
      - 'app/src/test/java/com/unboundaistudio/NightmareImageFlowPlannerTest.kt'
      - 'app/src/main/java/com/unboundaistudio/NightmareControlNetRecovery.kt'
      - 'app/src/test/java/com/unboundaistudio/NightmareControlNetRecoveryTest.kt'
      - 'app/src/main/java/com/unboundaistudio/NightmareConnectionDiagnostics.kt'
      - 'app/src/test/java/com/unboundaistudio/NightmareConnectionDiagnosticsTest.kt'
      - 'app/src/main/java/com/unboundaistudio/MobileI2VVideoEngine.kt'
      - 'app/src/main/java/com/unboundaistudio/OfflineVideoEngine.kt'
      - 'app/src/main/java/com/unboundaistudio/MobileI2VModelUpdater.kt'
      - '.github/workflows/boobs-v5.0-nightmare-studio.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify source version
        run: grep -q 'versionName = "1.69"' app/build.gradle.kts
      - name: Bundle Qwen2 tokenizer for offline MobileI2V text conditioning
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl --fail --location --retry 4 --retry-delay 5 --connect-timeout 30 \
            https://huggingface.co/Qwen/Qwen2-0.5B/resolve/main/tokenizer.json \
            -o app/src/main/assets/qwen2_tokenizer.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("app/src/main/assets/qwen2_tokenizer.json")
          model = json.loads(path.read_text())["model"]
          assert len(model["vocab"]) > 100000 and len(model["merges"]) > 100000
          print("Qwen2 tokenizer asset verified:", path.stat().st_size, "bytes")
          PY
      - name: Install selected launcher photo
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/icon_source.b64 > app/src/main/res/drawable-nodpi/boobs_launcher.jpg
          test -s app/src/main/res/drawable-nodpi/boobs_launcher.jpg
      - name: Compile and test Titties V1.69
        run: gradle assembleDebug lintDebug testDebugUnitTest --no-daemon
      - name: Verify removed image editor is absent from APK
        run: |
          python - <<'PYTHON'
          import zipfile
          with zipfile.ZipFile("app/build/outputs/apk/debug/app-debug.apk") as apk:
              assert not any("qwenimage21" in name.lower() for name in apk.namelist())
              dex = [apk.read(name) for name in apk.namelist() if name.endswith(".dex")]
              assert dex and all(marker not in part for part in dex for marker in
                                 (b"NativeQwenEditor", b"OnlineQwenEditor", b"com/scsonic/qwenimage21", b"Download Qwen Turbo"))
          PYTHON
      - name: Name APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Titties-V1.69-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Titties-V1.69-Android-APK
          path: app/build/outputs/apk/debug/Titties-V1.69-Android-debug.apk

      - name: Publish direct APK download in GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/Titties-V1.69-Android-debug.apk"
          TAG="v1.69"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Titties V1.69" --notes "Android debug APK for Titties V1.69. Download the APK asset directly; no artifact ZIP extraction needed." --target "$GITHUB_SHA"
          fi
