name: FreedomAI v1.2 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/freedomai-v1.2.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Show source version
        run: grep 'versionName' app/build.gradle.kts
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test and assemble v1.2 debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreedomAI-v1.2-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
