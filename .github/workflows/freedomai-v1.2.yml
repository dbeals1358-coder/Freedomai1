name: FreedomAI v1.4 Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/freedomai-v1.2.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Show source version
        run: grep 'versionName' app/build.gradle.kts
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify v1.4 app metadata and required features
        run: |
          grep -q 'versionName = "1.4"' app/build.gradle.kts
          grep -q 'android:label="Boobs v1.4"' app/src/main/AndroidManifest.xml
          grep -q 'RunwayVideoClient.generate' app/src/main/java/com/unboundaistudio/MainActivity.kt
          grep -q 'Text("Nude")' app/src/main/java/com/unboundaistudio/MainActivity.kt
          grep -q 'Text("AI Edit")' app/src/main/java/com/unboundaistudio/MainActivity.kt
          grep -q 'OfflineVideoEngine.render' app/src/main/java/com/unboundaistudio/MainActivity.kt
      - name: Test and assemble v1.4 debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK produced
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FreedomAI-v1.4-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
