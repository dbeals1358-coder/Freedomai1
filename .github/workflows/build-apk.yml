name: FreedomAI v2.0 - Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/photo-edit-strength, freedomai-v1.1-upload]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify source version and Hugging Face build secret
        env:
          HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
        run: |
          grep -q 'versionName = "2.0"' app/build.gradle.kts
          test -n "$HF_ACCESS_TOKEN" || { echo "::error::Set repository secret HF_ACCESS_TOKEN before building"; exit 1; }
      - name: Install selected launcher photo
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/icon_source.b64 > app/src/main/res/drawable-nodpi/boobs_launcher.jpg
          test -s app/src/main/res/drawable-nodpi/boobs_launcher.jpg
      - name: Compile and test FreedomAI v2.0
        env:
          HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
        run: gradle assembleDebug lintDebug testDebugUnitTest --no-daemon
      - name: Name APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FreedomAI-v2.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: FreedomAI-v2.0-APK
          path: app/build/outputs/apk/debug/FreedomAI-v2.0-debug.apk
