name: Boobs v1.5 - Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/photo-edit-strength, freedomai-v1.1-upload]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify current source version
        run: |
          grep -q 'versionName = "1.5"' app/build.gradle.kts
          grep -q 'Text("Boobs v1.5"' app/src/main/java/com/unboundaistudio/MainActivity.kt
      - name: Install selected launcher photo
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/icon_source.b64 > app/src/main/res/drawable-nodpi/boobs_launcher.jpg
          test -s app/src/main/res/drawable-nodpi/boobs_launcher.jpg
      - name: Compile and test Boobs v1.5
        run: gradle assembleDebug lintDebug testDebugUnitTest --no-daemon
      - name: Name APK with version
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Boobs-v1.5-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: Boobs-v1.5-APK
          path: app/build/outputs/apk/debug/Boobs-v1.5-debug.apk
