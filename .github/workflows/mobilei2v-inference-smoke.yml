name: MobileI2V real inference and MP4 integration test
on:
  workflow_run:
    workflows: ["Publish repaired MobileI2V model for FreedomAI"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference tools
        run: |
          python -m pip install 'numpy>=1.26,<2.3' 'onnxruntime==1.20.1'
          ffmpeg -version | head -n 1
      - name: Fetch original video VAE and compatible denoiser
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p models
          gh release download mobilei2v-models-v1 --repo "$GITHUB_REPOSITORY" --dir models --pattern 'vae_encoder.onnx'
          gh release download mobilei2v-models-v2 --repo "$GITHUB_REPOSITORY" --dir models --pattern 'mobilei2v_unet.onnx' --pattern 'turbo_vaed.onnx' --pattern 'validation_report.json'
      - name: Run ONNX VAE to video UNet to VAED to three-second MP4
        run: |
          mkdir -p smoke-output
          python - <<'PY'
          import gc, hashlib, json, pathlib, subprocess
          import numpy as np
          import onnxruntime as ort

          root = pathlib.Path("models")
          report_all = json.loads((root/"validation_report.json").read_text())
          report = report_all["mobilei2v_unet.onnx"]
          assert {"latent","timestep"}.issubset(report["inputs"])
          assert "text_emb" not in report["inputs"], "Official checkpoint has no text cross-attention"
          for name, sha in [
              ("vae_encoder.onnx","2fad3a342d7562da942133be3dab1b863e50a59d458cfcb7446ba9a5c856e21e"),
              ("turbo_vaed.onnx",report_all["turbo_vaed.onnx"]["sha256"]),
              ("mobilei2v_unet.onnx",report["sha256"])
          ]:
              path=root/name
              with path.open("rb") as f: actual=hashlib.file_digest(f,"sha256").hexdigest()
              assert actual==sha, f"Model hash mismatch: {name}"

          def open_model(name):
              opts=ort.SessionOptions()
              opts.intra_op_num_threads=2
              return ort.InferenceSession(str(root/name),opts,providers=["CPUExecutionProvider"])

          size=512
          yy,xx=np.mgrid[:size,:size].astype(np.float32)
          image=np.stack([xx/(size-1),yy/(size-1),0.5+0.35*np.sin(xx/24)],axis=0)
          image=((image*2-1)[None]).astype(np.float32)
          enc=open_model("vae_encoder.onnx")
          first=enc.run(None,{"pixel_values":image})[0]
          del enc
          gc.collect()
          assert first.shape==(1,128,16,16),f"Expect 512px/32 latents: {first.shape}"
          h,w=first.shape[-2:]
          lat=np.random.default_rng(2026).standard_normal((1,128,17,h,w)).astype(np.float32)
          lat[:,:,0]=first[0]
          model=open_model("mobilei2v_unet.onnx")
          assert {i.name for i in model.get_inputs()}=={"latent","timestep"}
          for step in range(3):
              sigma=1.0-step/3.0
              next_sigma=1.0-(step+1)/3.0
              prediction=model.run(None,{"latent":lat,"timestep":np.array([int(sigma*1000)],dtype=np.int64)})[0]
              assert prediction.shape==lat.shape and np.isfinite(prediction).all()
              lat=np.clip(lat+prediction*(next_sigma-sigma),-20,20).astype(np.float32)
              lat[:,:,0]=first[0]
          del model
          gc.collect()
          decoder=open_model("turbo_vaed.onnx")
          frames=[]
          for offset in range(0,17,5):
              n=min(5,17-offset)
              # Fixed 5-frame decoder: pad final 2 input frames, discard padded tail.
              part=np.ascontiguousarray(lat[:,:,offset:offset+n])
              if n<5:
                  part=np.concatenate([part,np.repeat(part[:,:,-1:],5-n,axis=2)],axis=2)
              assert part.shape==(1,128,5,16,16),part.shape
              rgb=decoder.run(None,{"latent":part})[0]
              assert rgb.ndim==5 and rgb.shape[:2]==(1,3),rgb.shape
              assert np.isfinite(rgb).all()
              count=rgb.shape[2]
              assert count>=n
              for t in range(n):
                  idx=min(count-1,int((t+0.5)*count/5))
                  f=rgb[0,:,idx].transpose(1,2,0)
                  frames.append((np.clip(f,-1,1)*127.5+127.5).astype(np.uint8))
          assert len(frames)==17
          diff=float(np.mean(np.abs(frames[0].astype(np.int16)-frames[8].astype(np.int16))))
          assert diff>0.5, f"Decoded frames show no motion: {diff}"
          h,w=frames[0].shape[:2]
          assert all(x.shape==(h,w,3) for x in frames)
          raw=b"".join(frames[min(16,i*17//36)].tobytes() for i in range(36))
          path=pathlib.Path("smoke-output/mobilei2v-3s.mp4")
          cmd=["ffmpeg","-hide_banner","-loglevel","error","-y","-f","rawvideo",
               "-pix_fmt","rgb24","-s",f"{w}x{h}","-r","12","-i","pipe:0",
               "-an","-c:v","libx264","-pix_fmt","yuv420p",str(path)]
          run=subprocess.run(cmd,input=raw,capture_output=True,timeout=180)
          assert run.returncode==0,run.stderr.decode(errors="replace")
          assert path.stat().st_size>2048 and path.read_bytes()[4:8]==b"ftyp"
          probe=subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","json",str(path)])
          duration=float(json.loads(probe)["format"]["duration"])
          assert 2.95<=duration<=3.10,duration
          result={"passed":True,"frames_generated":len(frames),"duration_s":duration,
                  "motion_difference":diff,"width":w,"height":h,
                  "warning":"CPU connectivity smoke test only; Android inference and realism not established."}
          pathlib.Path("smoke-output/test-report.json").write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MobileI2V-inference-MP4-smoke-test
          path: smoke-output/
          if-no-files-found: warn
          retention-days: 10
