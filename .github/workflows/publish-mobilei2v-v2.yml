name: Publish repaired MobileI2V model for FreedomAI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-mobilei2v-v2.yml'
  workflow_run:
    workflows: ["Convert MobileI2V Models to ONNX"]
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: ${{ github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Locate successful validated converter output
        id: model_source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            id="${{ github.event.workflow_run.id }}"
          else
            id="$(gh run list --repo "${{ github.repository }}" --workflow convert-mobilei2v.yml --branch main --status success --limit 5 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$id" && test "$id" != "null"
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
      - name: Download validated converter output
        uses: actions/download-artifact@v4
        with:
          name: MobileI2V-ONNX-Models
          path: mobilei2v-models
          run-id: ${{ steps.model_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify official checkpoint-compatible UNet and its SHA-256 manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("mobilei2v-models")
          manifest = json.loads((root / "validation_report.json").read_text())
          for name in ("vae_encoder.onnx", "mobilei2v_unet.onnx", "turbo_vaed.onnx"):
              record = manifest[name]
              if name == "vae_encoder.onnx":
                  assert "pixel_values" in record["inputs"], "Missing VAE pixel input"
              elif name == "mobilei2v_unet.onnx":
                  assert {"latent", "timestep"}.issubset(record["inputs"]), "Missing UNet inputs"
                  assert "text_emb" not in record["inputs"], "Official checkpoint has no text conditioning"
              else:
                  assert "latent" in record["inputs"], "Missing decoder latent input"
                  assert "frames" in record["outputs"], "Missing decoder frames output"
              model = root / name
              assert model.stat().st_size == record["bytes"], "Incorrect model size"
              with model.open("rb") as stream:
                  h = hashlib.file_digest(stream, "sha256").hexdigest()
              assert h.lower() == record["sha256"].lower(), "Model SHA-256 mismatch"
              assert model.stat().st_size > 100_000_000, "Model is truncated"
              print("Validated MobileI2V model:", name, model.stat().st_size, "bytes")
          PY
      - name: Publish one-file replacement for Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=mobilei2v-models-v2
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target main --title "MobileI2V checkpoint-compatible UNet v2" --notes "Official trained architecture and image guide mask. Includes the matching source VAE, denoiser, and decoder. The checkpoint lacks text-motion conditioning; on-device output still requires testing."
          gh release upload "$TAG" mobilei2v-models/vae_encoder.onnx mobilei2v-models/mobilei2v_unet.onnx mobilei2v-models/turbo_vaed.onnx mobilei2v-models/validation_report.json --clobber
